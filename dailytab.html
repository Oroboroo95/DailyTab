<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyTab - Feed</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dailytab-container">
    <div class="dailytab-header">
      <h1>DailyTab</h1>
      <p class="dailytab-date" id="current-date"></p>
    </div>
    
    <div class="dailytab-section">
      <h2>Tab inattive</h2>
      <div id="tabs-container" class="dailytab-feed"></div>
    </div>
    
    <div class="dailytab-section">
      <h2>Segnalibri recenti</h2>
      <div id="bookmarks-container" class="dailytab-feed"></div>
    </div>
  </div>
  
  <script src="dailytab.js"></script>
</body>
</html>
